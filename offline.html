<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EBE5">
<meta name="robots" content="noindex">
<title>Ifacelis · Sin conexión</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#F1EBE5;color:#2B2725;font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  img{width:72px;height:72px;border-radius:18px;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;font-size:34px;margin:0 0 10px}
  p{margin:0 0 26px;max-width:300px;line-height:1.55;color:#5C534D;font-size:15px}
  button{background:#2B2725;color:#F6F3EF;border:0;border-radius:999px;padding:14px 26px;font:inherit;font-weight:700;font-size:15px}
</style>
</head>
<body>
<main>
  <img src="/apple-touch-icon.png" alt="">
  <h1>Sin conexión</h1>
  <p>Lis necesita internet para ver tu piel y tu plan. Revisa el wifi o los datos y vuelve a intentarlo.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
